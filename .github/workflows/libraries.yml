name: Libraries

# libprelude for every platform @drkmttr/prelude ships, one artifact each.
# publish.yml calls this; run it by hand to fetch them for a publish from a
# checkout (ts/README.md#release).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    # Do not execute public-fork code on our self-hosted Macs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # libprelude needs cgo, so each platform's library builds on its own OS;
    # the arm64 Mac builds darwin-x64 as well, with clang aimed at x86_64.
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: [self-hosted, macOS, ARM64, dm-aarch64-darwin]
          - platform: darwin-x64
            runner: [self-hosted, macOS, ARM64, dm-aarch64-darwin]
          # No self-hosted aarch64-linux runner exists yet (every darkmatter
          # Linux runner is x86_64; the dm-aarch64-linux runner group is
          # empty and closed to public repos), so this one leg stays on a
          # GitHub-hosted arm64 runner for now.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: arc
    runs-on: ${{ matrix.runner }}
    env:
      # Keep the macos-14 deployment floor when building on Tahoe hosts.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      # The arc image carries Nix but no C compiler, and libprelude needs
      # cgo; take gcc (and patchelf, below) from nixpkgs. The other legs
      # have a host toolchain.
      - name: C compiler for cgo
        if: matrix.platform == 'linux-x64'
        run: |
          for p in $(nix build --no-link --print-out-paths nixpkgs#gcc nixpkgs#patchelf); do
            if [ -d "$p/bin" ]; then echo "$p/bin" >> "$GITHUB_PATH"; fi
          done
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun ts/scripts/npm-package.ts library ${{ matrix.platform }}
      # Nix's gcc stamps /nix/store paths into the library's RUNPATH; strip
      # them so the shipped .so resolves libc from the install machine's
      # own loader paths, like the other legs' builds.
      - name: Strip Nix paths from the library
        if: matrix.platform == 'linux-x64'
        run: patchelf --remove-rpath ts/lib/linux-x64/libprelude.so
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ts/lib/${{ matrix.platform }}/
          if-no-files-found: error
