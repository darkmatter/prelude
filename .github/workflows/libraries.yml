name: Libraries

# libprelude for every platform @drkmttr/prelude ships, one artifact each.
# publish.yml calls this; run it by hand to fetch them for a publish from a
# checkout (ts/README.md#release).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    # libprelude needs cgo, so each platform's library builds on its own OS;
    # the arm64 Mac builds darwin-x64 as well, with clang aimed at x86_64.
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-14
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun ts/scripts/npm-package.ts library ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ts/lib/${{ matrix.platform }}/
          if-no-files-found: error
