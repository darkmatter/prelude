name: Libraries

# libprelude for every platform @drkmttr/prelude ships, one artifact each.
# publish.yml calls this; run it by hand to fetch them for a publish from a
# checkout (ts/README.md#release).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    # Do not execute public-fork code on our self-hosted Macs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # libprelude needs cgo. The arm64 Mac builds both darwin libraries, with
    # clang aimed at x86_64 for darwin-x64. arc builds both Linux libraries
    # with gcc from nixpkgs, since the arc image has no C compiler; no arm64
    # Linux runner exists, so linux-arm64 uses nixpkgs' aarch64 cross gcc.
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: [self-hosted, macOS, ARM64, dm-aarch64-darwin]
          - platform: darwin-x64
            runner: [self-hosted, macOS, ARM64, dm-aarch64-darwin]
          - platform: linux-arm64
            runner: arc
            gcc: nixpkgs#pkgsCross.aarch64-multiplatform.buildPackages.gcc
            cc: aarch64-unknown-linux-gnu-gcc
          - platform: linux-x64
            runner: arc
            gcc: nixpkgs#gcc
            cc: gcc
    runs-on: ${{ matrix.runner }}
    env:
      # Keep the macos-14 deployment floor when building on Tahoe hosts.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: C compiler for cgo
        if: matrix.gcc
        env:
          GCC: ${{ matrix.gcc }}
          CC_NAME: ${{ matrix.cc }}
        run: |
          for p in $(nix build --no-link --print-out-paths "$GCC" nixpkgs#patchelf); do
            if [ -d "$p/bin" ]; then echo "$p/bin" >> "$GITHUB_PATH"; fi
          done
          echo "CC=$CC_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun ts/scripts/npm-package.ts library ${{ matrix.platform }}
      # Nix's gcc stamps /nix/store paths into the library's RUNPATH; strip
      # them so the shipped .so resolves libc from the install machine's
      # own loader paths, like the other legs' builds.
      - name: Strip Nix paths from the library
        if: matrix.gcc
        run: patchelf --remove-rpath "ts/lib/${{ matrix.platform }}/libprelude.so"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ts/lib/${{ matrix.platform }}/
          if-no-files-found: error
