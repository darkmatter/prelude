name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on the ephemeral arc pods, which may serve public-fork
        # PRs. A self-hosted Mac must never run code from a public fork, so
        # that leg joins the matrix only for pushes and pull requests from
        # this repo.
        runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                   && fromJSON('["arc", ["self-hosted", "macOS"]]')
                   || fromJSON('["arc"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    # No-ops where Nix is already on PATH (arc image, self-hosted Mac): the
    # installer script exits early when it finds nix.
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v14
      with:
        name: darkmatter
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix flake check
    - name: Enter the devshell without host tools
      run: |
        nix develop . --ignore-environment --keep HOME -c bash -eu <<'BASH'
          test -f "$PRELUDE_LIB"
          test -z "${PRELUDE_WORKSPACE_ACTIVE-}"
          x --list
          cc --version
          pkg-config --version
        BASH
  typescript:
    # The npm package in ts/, as adhere's CI checks its own: typecheck, test
    # against a freshly built libprelude, then install the packed package and
    # load it.
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on the ephemeral arc pods, which may serve public-fork
        # PRs. A self-hosted Mac must never run code from a public fork, so
        # that leg joins the matrix only for pushes and pull requests from
        # this repo.
        runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                   && fromJSON('["arc", ["self-hosted", "macOS"]]')
                   || fromJSON('["arc"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ts
    steps:
    - uses: actions/checkout@v4
    # The arc image carries Nix but no C compiler, and libprelude needs cgo;
    # take gcc from nixpkgs. The Mac leg uses its host clang.
    - name: C compiler for cgo
      if: runner.os == 'Linux'
      run: |
        for p in $(nix build --no-link --print-out-paths nixpkgs#gcc); do
          if [ -d "$p/bin" ]; then echo "$p/bin" >> "$GITHUB_PATH"; fi
        done
    - uses: actions/setup-go@v5
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.2"
    - run: bun install --frozen-lockfile
    - run: bun run typecheck
    - run: bun scripts/npm-package.ts library
    - run: bun run test
    - run: bun scripts/npm-package.ts smoke
