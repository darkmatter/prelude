name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # A self-hosted Mac must never run code from a public fork, so that leg
        # joins the matrix only for pushes and pull requests from this repo.
        runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                   && fromJSON('["ubuntu-latest", ["self-hosted", "macOS"]]')
                   || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v14
      with:
        name: darkmatter
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix flake check
    - name: Enter the devshell without host tools
      run: |
        nix develop . --ignore-environment --keep HOME -c bash -eu <<'BASH'
          test -f "$PRELUDE_LIB"
          test -z "${PRELUDE_WORKSPACE_ACTIVE-}"
          x --list
          cc --version
          pkg-config --version
        BASH
  typescript:
    # The npm package in ts/, as adhere's CI checks its own: typecheck, test
    # against a freshly built libprelude, then install the packed package and
    # load it.
    strategy:
      fail-fast: false
      matrix:
        # A self-hosted Mac must never run code from a public fork, so that leg
        # joins the matrix only for pushes and pull requests from this repo.
        runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                   && fromJSON('["ubuntu-latest", ["self-hosted", "macOS"]]')
                   || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.4"
    - run: bun install --frozen-lockfile
    - run: bun run typecheck
    - run: bun scripts/npm-package.ts library
    - run: bun run test
    - run: bun scripts/npm-package.ts smoke
